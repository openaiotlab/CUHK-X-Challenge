name: Update Leaderboard

on:
  # Daily schedule disabled until Kaggle secrets (KAGGLE_USERNAME / KAGGLE_KEY)
  # and the real competition slugs in scripts/update_leaderboard.py are set.
  # To re-enable, uncomment the two lines below.
  # schedule:
  #   # 02:00 UTC = 10:00 HKT (UTC+8) every day
  #   - cron: '0 2 * * *'
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Kaggle API
        run: pip install --quiet kaggle

      - name: Configure Kaggle credentials
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle
          printf '{"username":"%s","key":"%s"}\n' "$KAGGLE_USERNAME" "$KAGGLE_KEY" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Fetch leaderboard
        run: python scripts/update_leaderboard.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leaderboard.json
          if git diff --staged --quiet; then
            echo "No leaderboard changes."
          else
            git commit -m "chore: auto-update leaderboard $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
